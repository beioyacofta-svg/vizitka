<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Надежда Тарасова — Мастер макраме</title>
<style>
  :root{
    --bg-1:#fdf6ee;
    --bg-2:#f7ece0;
    --accent-1:#d98e73;
    --accent-2:#c9a15a;
    --accent-3:#a97155;
    --text-main:#4a352a;
    --text-soft:#8a6f5c;
    --card-bg:#fffdfa;
    --shadow:rgba(169,113,85,0.25);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #fbe9d8 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #f3ddc9 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text-main);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  /* decorative macrame-like knots in background */
  .bg-knots{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
  }
  .bg-knots svg{
    position:absolute;
  }
  .knot-a{ top:6%; left:8%; width:90px; height:90px; animation: sway 7s ease-in-out infinite; }
  .knot-b{ bottom:8%; right:6%; width:120px; height:120px; animation: sway 9s ease-in-out infinite reverse; }
  .knot-c{ top:60%; left:2%; width:60px; height:60px; animation: sway 6s ease-in-out infinite; }

  @keyframes sway{
    0%,100%{ transform: rotate(-4deg) translateY(0px); }
    50%{ transform: rotate(4deg) translateY(-8px); }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:28px;
    padding:48px 32px 40px;
    text-align:center;
    box-shadow:
      0 20px 50px var(--shadow),
      0 2px 8px rgba(169,113,85,0.15);
    border:1px solid rgba(201,161,90,0.25);
    animation: rise 0.8s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(24px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .avatar-ring{
    width:112px;
    height:112px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    animation: spin 10s linear infinite;
    padding:4px;
  }
  .avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--card-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin-reverse 10s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spin-reverse{ to{ transform:rotate(-360deg); } }

  .avatar-inner svg{ width:56px; height:56px; color:var(--accent-3); }

  h1.name{
    margin:0 0 8px;
    font-size:clamp(28px, 6vw, 36px);
    font-weight:700;
    letter-spacing:0.3px;
    background:linear-gradient(90deg, var(--accent-3), var(--accent-1), var(--accent-2), var(--accent-1), var(--accent-3));
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation: shine 5s linear infinite;
    filter: drop-shadow(0 0 18px rgba(217,142,115,0.35));
  }

  @keyframes shine{
    to{ background-position:300% center; }
  }

  .role{
    margin:0 0 28px;
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-soft);
    font-weight:600;
    position:relative;
    display:inline-block;
    padding-bottom:14px;
  }
  .role::after{
    content:"";
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:48px;
    height:3px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:30px;
  }

  .social-link{
    --size:52px;
    width:var(--size);
    height:var(--size);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg, #fbf2e7, #f4e4d1);
    color:var(--accent-3);
    text-decoration:none;
    box-shadow: 4px 4px 10px rgba(169,113,85,0.15), -4px -4px 10px #ffffff;
    transition: transform 0.3s cubic-bezier(.2,.9,.25,1), color 0.3s, box-shadow 0.3s;
    position:relative;
    overflow:hidden;
  }
  .social-link svg{
    width:26px;
    height:26px;
    position:relative;
    z-index:1;
    transition: transform 0.4s ease;
  }
  .social-link::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .social-link:hover{
    transform:translateY(-6px) rotate(-4deg) scale(1.06);
    color:#fff;
    box-shadow: 0 12px 22px rgba(201,161,90,0.4);
  }
  .social-link:hover::before{ opacity:1; }
  .social-link:hover svg{ transform:scale(1.1); }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 34px;
    border:none;
    border-radius:50px;
    font-size:16px;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    cursor:pointer;
    background:linear-gradient(120deg, var(--accent-3), var(--accent-1), var(--accent-2));
    background-size:220% auto;
    box-shadow: 0 10px 24px rgba(201,161,90,0.45);
    transition: background-position 0.6s ease, transform 0.25s ease, box-shadow 0.25s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .cta svg{ width:20px; height:20px; transition: transform 0.3s ease; }
  .cta:hover{
    background-position:right center;
    transform:translateY(-3px);
    box-shadow: 0 16px 30px rgba(201,161,90,0.55);
  }
  .cta:hover svg{ transform: translateX(4px) rotate(8deg); }
  .cta:active{ transform:translateY(0) scale(0.97); }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 10px 24px rgba(201,161,90,0.45); }
    50%{ box-shadow: 0 10px 30px rgba(201,161,90,0.7), 0 0 0 6px rgba(201,161,90,0.08); }
  }

  .footer-note{
    margin-top:24px;
    font-size:12px;
    color:var(--text-soft);
    letter-spacing:0.5px;
  }

  @media (max-width:420px){
    .card{ padding:38px 22px 32px; border-radius:22px; }
    .social-link{ --size:48px; }
  }
</style>
</head>
<body>

  <div class="bg-knots" aria-hidden="true">
    <svg class="knot-a" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="34" stroke="#c9a15a" stroke-width="3" stroke-dasharray="6 8"/>
      <circle cx="50" cy="50" r="18" stroke="#d98e73" stroke-width="3"/>
    </svg>
    <svg class="knot-b" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 50 Q50 10 80 50 Q50 90 20 50 Z" stroke="#a97155" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="8" fill="#d98e73" opacity="0.5"/>
    </svg>
    <svg class="knot-c" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="25" y="25" width="50" height="50" rx="12" stroke="#c9a15a" stroke-width="3"/>
    </svg>
  </div>

  <main class="card">
    <div class="avatar-ring">
      <div class="avatar-inner">
        <!-- macrame / knot icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2v6M12 16v6M4 6c0 4 4 3 4 7s-4 3-4 7M20 6c0 4-4 3-4 7s4 3 4 7"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
    </div>

    <h1 class="name">Надежда Тарасова</h1>
    <p class="role">Мастер макраме</p>

    <div class="socials">
      <a class="social-link" href="https://t.me/nadjat_29" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.05 3.61 2.98 10.62c-1.23.49-1.22 1.17-.22 1.47l4.63 1.45 1.79 5.5c.22.6.38.84.78.84.36 0 .53-.16.75-.39l1.83-1.78 4.66 3.44c.86.48 1.47.23 1.69-.79l3.05-14.4c.32-1.28-.49-1.86-1.9-1.35zM8.6 13.8l9.2-5.8c.44-.27.84-.12.51.18l-7.6 6.87-.29 3.16-1.82-4.41z"/>
        </svg>
      </a>
    </div>

    <a class="cta" href="https://t.me/nadjat_29" target="_blank" rel="noopener noreferrer">
      Написать мне
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <p class="footer-note">Ручная работа · Уют в каждом узле</p>
  </main>

</body>
</html>
